spring.application.name=bonbio-backend
server.port=${PORT:8084}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://spectacular-rebirth-production-5f2c.up.railway.app,http://localhost:4200}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bonbio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}
supabase.bucket=products
