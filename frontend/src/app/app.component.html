<mat-sidenav-container class="shell">
  <mat-sidenav [mode]="isMobile ? 'over' : 'side'" [opened]="!isMobile || mobileNavOpen" (openedChange)="onDrawerOpenedChange($event)" (backdropClick)="closeMobileNav()" class="side">
    <div class="brand"><span class="brand-mark">B</span><span>BonBio</span></div>
    <p class="eyebrow">Atelier de gestion</p>
    <nav>
      <a mat-button routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }"><mat-icon>dashboard</mat-icon> Tableau de bord</a>
      <a mat-button routerLink="/clients" routerLinkActive="active"><mat-icon>people</mat-icon> Clients</a>
      <a mat-button routerLink="/produits" routerLinkActive="active"><mat-icon>cake</mat-icon> Produits</a>
      <a mat-button routerLink="/categories" routerLinkActive="active"><mat-icon>category</mat-icon> Catégories</a>
      <a mat-button routerLink="/commandes" routerLinkActive="active"><mat-icon>receipt_long</mat-icon> Commandes</a>
    </nav>
    <div class="side-note"><mat-icon>auto_awesome</mat-icon><span>Une journée douce commence par une bonne organisation.</span></div>
  </mat-sidenav>
  <mat-sidenav-content>
    <mat-toolbar><button *ngIf="isMobile" mat-icon-button class="menu-toggle" aria-label="Ouvrir le menu" [attr.aria-expanded]="mobileNavOpen" (click)="toggleMobileNav()"><mat-icon>menu</mat-icon></button><span class="mobile-brand">BonBio</span><span class="spacer"></span><span class="status-dot"></span><span class="connection-label">Connecté à l'atelier</span></mat-toolbar>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
